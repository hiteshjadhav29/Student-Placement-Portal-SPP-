<!DOCTYPE html>
<html>

<head>
    <title>My Skills</title>
</head>

<body>

    <h1>My Skills</h1>

    <a href="{% url 'students:add_skill' %}">
        Add Skill
    </a>

    <hr>

    {% if skills %}

    <ul>

        {% for skill in skills %}

        <li>
            {{ skill.skill_name }}

            <a href="{% url 'students:edit_skill' skill.id %}">
                Edit
            </a>

            <a href="{% url 'students:delete_skill' skill.id %}">
                Delete
            </a>
        </li>

        {% endfor %}

    </ul>

    {% else %}

    <p>No skills added yet.</p>

    {% endif %}

</body>

</html>

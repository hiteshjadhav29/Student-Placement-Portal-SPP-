<!DOCTYPE html>
<html>

<head>
    <title>Delete Certification</title>
</head>

<body>

    <h2>Delete Certification</h2>

    <p>Are you sure you want to delete this certification?</p>

    <b>{{ certification.certificate_name }}</b>

    <form method="POST">

        {% csrf_token %}

        <button type="submit">
            Delete
        </button>

    </form>

    <br>

    <a href="{% url 'students:certifications' %}">
        Cancel
    </a>

</body>

</html>

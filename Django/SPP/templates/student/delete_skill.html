{% extends "base.html" %}

{% block title %}Delete Skill - Student Placement Portal{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="spp-card text-center py-4">
            <div class="spp-stat-icon red mx-auto mb-3" style="width:60px; height:60px; font-size:1.75rem;">
                <i class="bi bi-exclamation-triangle-fill"></i>
            </div>
            <h4 class="fw-bold mb-2" style="color: var(--spp-navy);">Confirm Skill Deletion</h4>
            <p class="text-muted mb-3">Are you sure you want to delete the skill <strong>"{{ skill.skill_name }}"</strong>?</p>

            <form method="POST" class="d-inline-flex justify-content-center gap-2">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger fw-bold rounded-3 px-4 py-2">
                    <i class="bi bi-trash-fill me-1"></i> Delete Skill
                </button>
                <a href="{% url 'students:skills' %}" class="btn-spp-outline">
                    Cancel
                </a>
            </form>
        </div>
    </div>
</div>
{% endblock %}

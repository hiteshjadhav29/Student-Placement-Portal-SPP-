<!DOCTYPE html>
<html>

<head>
    <title>Delete Project</title>
</head>

<body>

    <h2>Delete Project</h2>

    <p>Are you sure you want to delete this project?</p>

    <b>{{ project.title }}</b>

    <form method="POST">

        {% csrf_token %}

        <button type="submit">
            Delete
        </button>

    </form>

    <br>

    <a href="{% url 'students:projects' %}">
        Cancel
    </a>

</body>

</html>

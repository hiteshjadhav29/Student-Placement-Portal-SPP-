{% extends 'base.html' %}

{% block title %}
Edit Job
{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-warning text-dark">

            <h3>Edit Job</h3>

        </div>

        <div class="card-body">

            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-success">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <form method="POST">

                {% csrf_token %}

                {{ form.as_p }}

                <div class="mt-4">

                    <button type="submit" class="btn btn-success">
                        Update Job
                    </button>

                    <a href="{% url 'jobs:job_detail' job.id %}"
                       class="btn btn-info">
                        View Job
                    </a>

                    <a href="{% url 'jobs:manage_jobs' %}"
                       class="btn btn-secondary">
                        Cancel
                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}

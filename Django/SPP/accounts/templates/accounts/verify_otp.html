{% extends 'auth_base.html' %}

{% block title %}
Verify OTP
{% endblock %}

{% block content %}

<div class="row justify-content-center align-items-center vh-100">

    <div class="col-md-5">

        <div class="card shadow-lg border-0 rounded-4">

            <div class="card-header bg-success text-white text-center py-4">
                <h2><i class="bi bi-shield-lock-fill"></i> Verify OTP</h2>
                <p class="mb-0">Enter the 6-digit OTP sent to <strong>{{ email }}</strong></p>
            </div>

            <div class="card-body p-4">

                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-{{ message.tags }}">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}

                <form method="POST">
                    {% csrf_token %}

                    <div class="mb-4">
                        <label class="form-label font-weight-bold">Enter 6-Digit OTP</label>
                        <input type="text" name="otp_code" class="form-control form-control-lg text-center letter-spacing-2" maxlength="6" placeholder="123456" required autofocus>
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-success btn-lg">
                            <i class="bi bi-check-circle-fill"></i> Verify OTP
                        </button>
                    </div>

                </form>

                <hr>

                <div class="text-center">
                    <a href="{% url 'accounts:forgot_password' %}" class="btn btn-link text-decoration-none text-muted">
                        Resend OTP / Change Email
                    </a>
                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}

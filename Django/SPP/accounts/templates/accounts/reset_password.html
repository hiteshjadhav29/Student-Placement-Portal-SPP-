{% extends 'auth_base.html' %}

{% block title %}
Reset Password
{% endblock %}

{% block content %}

<div class="row justify-content-center align-items-center vh-100">

    <div class="col-md-5">

        <div class="card shadow-lg border-0 rounded-4">

            <div class="card-header bg-primary text-white text-center py-4">
                <h2><i class="bi bi-lock-fill"></i> Reset Password</h2>
                <p class="mb-0">Create a new secure password</p>
            </div>

            <div class="card-body p-4">

                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-{{ message.tags }}">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}

                <form method="POST">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label font-weight-bold">New Password</label>
                        <input type="password" name="password1" class="form-control" placeholder="Enter new password" minlength="6" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label font-weight-bold">Confirm New Password</label>
                        <input type="password" name="password2" class="form-control" placeholder="Confirm new password" minlength="6" required>
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="bi bi-save-fill"></i> Save New Password
                        </button>
                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
